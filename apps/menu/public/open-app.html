<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening App...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #faf8f5;
      color: #2b1810;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(234, 88, 12, 0.15);
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #6c584c;
      line-height: 1.4;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: #ea580c;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:active {
      background: #c2410c;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1 id="title">Opening App...</h1>
    <p id="subtitle">Taking you to our profile. If it doesn't open automatically, tap below.</p>
    <a id="fallbackBtn" class="btn" href="#">Continue in Browser</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var app = (params.get('app') || '').toLowerCase();
      var rawUrl = params.get('url') || '';

      if (!rawUrl) {
        document.getElementById('title').textContent = 'No link provided';
        document.getElementById('subtitle').textContent = 'Please return to the menu.';
        document.getElementById('fallbackBtn').style.display = 'none';
        return;
      }

      var targetUrl = rawUrl.startsWith('http') ? rawUrl : 'https://' + rawUrl;
      var fallbackBtn = document.getElementById('fallbackBtn');
      fallbackBtn.href = targetUrl;

      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      var isAndroid = /Android/i.test(navigator.userAgent);
      var isMobile = isIOS || isAndroid;

      if (!isMobile) {
        window.location.replace(targetUrl);
        return;
      }

      function buildDeepLink(appType, webUrl) {
        if (appType === 'facebook') {
          return 'fb://facewebmodal/f?href=' + encodeURIComponent(webUrl);
        }

        if (appType === 'instagram') {
          var userMatch = webUrl.match(/instagram\.com\/([a-zA-Z0-9._]+)/i);
          var username = userMatch ? userMatch[1].replace(/\/$/, '') : '';
          if (username && username !== 'p' && username !== 'reel') {
            return 'instagram://user?username=' + encodeURIComponent(username);
          }
          return 'instagram://app';
        }

        if (appType === 'youtube') {
          var ytClean = webUrl.replace(/^https?:\/\/(www\.)?(youtube\.com\/|youtu\.be\/)/i, '');
          if (isAndroid) {
            return 'vnd.youtube:' + ytClean;
          }
          return 'youtube://' + ytClean;
        }

        if (appType === 'tiktok') {
          var ttMatch = webUrl.match(/tiktok\.com\/@?([a-zA-Z0-9._]+)/i);
          var ttUser = ttMatch ? ttMatch[1].replace(/\/$/, '') : '';
          if (ttUser) {
            return 'snssdk1233://user/profile/' + encodeURIComponent(ttUser);
          }
          return 'tiktok://';
        }

        if (appType === 'maps') {
          if (isIOS) {
            return 'comgooglemaps://?q=' + encodeURIComponent(webUrl);
          }
          return 'geo:0,0?q=' + encodeURIComponent(webUrl);
        }

        return null;
      }

      var deepLink = buildDeepLink(app, targetUrl);

      var timer = null;
      var redirectCancelled = false;

      function cancelRedirect() {
        redirectCancelled = true;
        if (timer) clearTimeout(timer);
      }

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          cancelRedirect();
        }
      });
      window.addEventListener('pagehide', cancelRedirect);

      if (deepLink) {
        window.location.href = deepLink;

        timer = setTimeout(function () {
          if (!redirectCancelled && !document.hidden) {
            window.location.replace(targetUrl);
          }
        }, 1600);
      } else {
        window.location.replace(targetUrl);
      }
    })();
  </script>
</body>
</html>
