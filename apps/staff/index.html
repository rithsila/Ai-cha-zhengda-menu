<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;700;900&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Ai-Cha &amp; Zhengda — Staff</title>
    <script>
      // Resolve theme & layout before first paint to avoid flashes.
      try {
        var l = window.localStorage.getItem('staff-layout-style');
        var resolvedLayout = (l === 'classic-board' || l === 'compact-sidebar') ? l : 'compact-sidebar';
        document.documentElement.dataset.layout = resolvedLayout;

        var t = window.localStorage.getItem('staff-theme');
        if (!t) {
          t = resolvedLayout === 'compact-sidebar' ? 'dark' : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }
        document.documentElement.dataset.theme = t;
      } catch {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.dataset.layout = 'compact-sidebar';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
